<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index — Estefi Panizza</title>
    <style>
        /* --- Typography --- */
        @font-face {
            font-family: 'Basis Grotesque Pro';
            src: url('assets/BasisGrotesquePro-Regular.woff2') format('woff2'),
                 url('assets/BasisGrotesquePro-Regular.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Basis Grotesque Pro';
            src: url('assets/BasisGrotesquePro-Italic.woff2') format('woff2'),
                 url('assets/BasisGrotesquePro-Italic.woff') format('woff');
            font-weight: normal;
            font-style: italic;
            font-display: swap;
        }

        @font-face {
            font-family: 'Basis Grotesque Pro';
            src: url('assets/BasisGrotesquePro-MediumItalic.woff2') format('woff2'),
                 url('assets/BasisGrotesquePro-MediumItalic.woff') format('woff');
            font-weight: 500;
            font-style: italic;
            font-display: swap;
        }

        @font-face {
            font-family: 'Basis Grotesque Pro';
            src: url('assets/BasisGrotesquePro-Medium.woff2') format('woff2'),
                 url('assets/BasisGrotesquePro-Medium.woff') format('woff');
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'NB International';
            src: url('NBInternationalMonoWebfont.woff2') format('woff2'),
                 url('NBInternationalMonoWebfont.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        /* --- Reset & Base Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Basis Grotesque Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #fff; /* Changed to white to match your screenshot */
            color: #111;
            -webkit-font-smoothing: antialiased;
            font-weight: 500;
            /* Allow normal vertical scrolling for the index page */
            overflow-y: auto; 
            overflow-x: hidden;
        }

        /* --- Navigation --- */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 2rem 2vw;
            z-index: 100;
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 0px;
            color: #111; /* Changed to dark since background is white */
        }

        nav .nav-links {
            display: flex;
            gap: 2rem;
        }

        nav a {
            color: inherit;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        nav a:hover {
            opacity: 0.6;
        }

        /* Mobile Hamburger Button (Hidden on Desktop) */
        .mobile-menu-toggle {
            display: none;
            background: none;
            border: none;
            width: 32px;
            height: 20px;
            position: relative;
            cursor: pointer;
            z-index: 200;
            color: inherit;
        }

        .hamburger-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background-color: currentColor;
            left: 0;
            transition: transform 0.3s ease, top 0.3s ease;
        }

        .hamburger-line:first-child { top: 4px; }
        .hamburger-line:last-child { top: 14px; }

        /* Hamburger Morph Animation */
        nav.menu-open .hamburger-line:first-child {
            top: 9px;
            transform: rotate(45deg);
        }
        nav.menu-open .hamburger-line:last-child {
            top: 9px;
            transform: rotate(-45deg);
        }

        /* --- Index Layout --- */
        .index-container {
            padding: 120px 2vw 5vw 2vw; /* Pushes content below the fixed nav */
            width: 100%;
            min-height: 100vh;
        }

        .page-title {
            font-size: 7vw;
            font-weight: 400;
            letter-spacing: -2px;
            margin-bottom: 6rem; /* Huge space below "Index" like in the screenshot */
            line-height: 1;
        }

        /* --- Project Rows --- */
        .project-row {
            margin-bottom: 5rem; /* Space between each project row */
        }

        .project-row-title {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 1.5rem;
        }

        .project-images-container {
            display: flex;
            gap: 1.5vw;
            /* Allows horizontal scrolling if the images wider than the screen */
            overflow-x: auto; 
            /* Hide the ugly default scrollbar but keep the functionality */
            scrollbar-width: none; 
            -ms-overflow-style: none;
            padding-bottom: 1rem; 
        }

        .project-images-container::-webkit-scrollbar {
            display: none;
        }

        .image-link {
            flex-shrink: 0; /* Prevents flexbox from squishing the images */
            display: block;
            height: 35vh; /* Sets a consistent height for all images in the row */
            background-color: rgba(0,0,0,0.03); /* Tiny placeholder flash */
            transition: opacity 0.3s ease;
        }

        .image-link:hover {
            opacity: 0.8;
        }

        .image-link img {
            height: 100%;
            width: auto; /* Lets the width scale naturally based on the image aspect ratio */
            object-fit: contain; /* ensures the whole image is seen */
        }

        /* =========================================
           MOBILE SPECIFIC STYLES
           ========================================= */
        @media (max-width: 768px) {
            /* --- Mobile Nav Styles --- */
            nav {
                font-size: 1rem;
                flex-direction: row; 
                align-items: center;
                padding: 1.5rem 5vw;
            }

            .mobile-menu-toggle {
                display: block; 
            }

            .logo, .mobile-menu-toggle {
                position: relative;
                z-index: 200; 
            }

            nav .nav-links {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background-color: #fff; /* Pure white overlay */
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 2.5rem;
                font-size: 2.5rem;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.4s ease;
                z-index: 100;
            }

            nav.menu-open .nav-links {
                opacity: 1;
                pointer-events: auto;
            }

            /* --- Mobile Layout Tweaks --- */
            .index-container {
                padding: 120px 5vw 5vw 5vw; 
            }

            .page-title {
                font-size: 15vw;
                margin-bottom: 4rem; 
            }

            .project-row {
                margin-bottom: 3.5rem; 
            }

            .image-link {
                height: 25vh; /* Slightly shorter images on mobile to fit nicely */
            }

            .project-images-container {
                gap: 3vw; /* Slightly bigger gap on mobile touch screens */
            }
        }

    </style>
</head>
<body>

    <nav id="main-nav">
        <div class="logo">
            <a href="index.html">Estefi Panizza</a>
        </div>

        <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle Menu">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
        </button>

        <div class="nav-links">
            <div><a href="/">Work</a></div>
            <div><a href="/overview.html">Index</a></div>
            <div><a href="/about.html">About</a></div>
            <div><a href="/about.html#email">Contact</a></div>
            <div><a href="https://instagram.com/estefi_panizza/">Instagram</a></div>
        </div>
    </nav>

    <div class="index-container">
        <h1 class="page-title">Index</h1>
        
        <div id="projects-list"></div>
    </div>

    <script>
        // ==========================================
        // MOBILE MENU LOGIC
        // ==========================================
        const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
        const mainNav = document.getElementById('main-nav');

        // Toggle the menu open and closed
        mobileMenuToggle.addEventListener('click', () => {
            mainNav.classList.toggle('menu-open');
            // Lock scrolling on the body when the menu is open
            if (mainNav.classList.contains('menu-open')) {
                document.body.style.overflow = 'hidden'; 
            } else {
                document.body.style.overflow = 'auto'; 
            }
        });

        // Close menu if a link is clicked
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                if (window.innerWidth <= 768) {
                    mainNav.classList.remove('menu-open');
                    document.body.style.overflow = 'auto';
                }
            });
        });

        // Ensure menu resets properly if resizing from mobile to desktop
        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                mainNav.classList.remove('menu-open'); 
                document.body.style.overflow = 'auto'; 
            }
        });

        // ==========================================
        // INDEX DATA FETCHING LOGIC
        // ==========================================
        const projectsListContainer = document.getElementById('projects-list');

        async function loadIndexData() {
            try {
                // Fetch the JSON file
                const response = await fetch('./projects.json');
                const projectsData = await response.json();

                // Loop through every project in the JSON
                Object.keys(projectsData).forEach(key => {
                    const project = projectsData[key];
                    
                    // Create the wrapper for the entire row
                    const rowDiv = document.createElement('div');
                    rowDiv.className = 'project-row';

                    // 1. Create and add the title
                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'project-row-title';
                    // Using your JSON structure: "ANTONI POROWSKI X MAN ABOUT TOWN" etc.
                    titleDiv.innerText = project.title; 
                    
                    if(project.client && project.client !== project.title) {
                       titleDiv.innerText = `${project.client} / ${project.title}`;
                    }

                    rowDiv.appendChild(titleDiv);

                    // 2. Create the container for the horizontal strip of images
                    const imagesContainer = document.createElement('div');
                    imagesContainer.className = 'project-images-container';

                    // 3. Loop through the media array and add every image
                    if (project.media && project.media.length > 0) {
                        project.media.forEach(mediaItem => {
                            // Only add images (skip videos for the index to keep it clean, or include them if you prefer)
                            if (mediaItem.type === 'image') {
                                const link = document.createElement('a');
                                link.href = `project.html?id=${key}`;
                                link.className = 'image-link';
                                
                                // Added loading="lazy" because this page will load a massive amount of images
                                link.innerHTML = `<img src="${mediaItem.src}" alt="${project.title}" loading="lazy">`;
                                
                                imagesContainer.appendChild(link);
                            }
                        });
                    }

                    rowDiv.appendChild(imagesContainer);
                    projectsListContainer.appendChild(rowDiv);
                });

            } catch (error) {
                console.error("Error loading projects.json:", error);
                projectsListContainer.innerHTML = `<p style="padding: 2vw;">Failed to load projects.</p>`;
            }
        }

        // Run the function
        loadIndexData();
    </script>
</body>
</html>
