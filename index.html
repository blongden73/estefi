<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estefi Panizza Art Direction</title>
    <style>
        @font-face {
        font-family: 'Basis Grotesque Pro';
        src: url('assets/BasisGrotesquePro-Regular.woff2') format('woff2'),
            url('assets/BasisGrotesquePro-Regular.woff') format('woff');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
    }

    @font-face {
        font-family: 'Basis Grotesque Pro';
        src: url('assets/BasisGrotesquePro-Italic.woff2') format('woff2'),
            url('assets/BasisGrotesquePro-Italic.woff') format('woff');
        font-weight: normal;
        font-style: italic;
        font-display: swap;
    }

    @font-face {
        font-family: 'Basis Grotesque Pro';
        src: url('assets/BasisGrotesquePro-MediumItalic.woff2') format('woff2'),
            url('assets/BasisGrotesquePro-MediumItalic.woff') format('woff');
        font-weight: 500;
        font-style: italic;
        font-display: swap;
    }

    @font-face {
        font-family: 'Basis Grotesque Pro';
        src: url('Bassets/asisGrotesquePro-Medium.woff2') format('woff2'),
            url('assets/BasisGrotesquePro-Medium.woff') format('woff');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
    }
        @font-face {
            font-family: 'NB International';
            src: url('NBInternationalMonoWebfont.woff2') format('woff2'),
                 url('NBInternationalMonoWebfont.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'NB International';
            src: url('NBInternationalRegularWebfont.woff2') format('woff2'),
                 url('NBInternationalRegularWebfont.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'NB International';
            src: url('NBInternationalLightItalicWebfont.woff2') format('woff2'),
                 url('NBInternationalLightItalicWebfont.woff') format('woff');
            font-weight: 300;
            font-style: italic;
            font-display: swap;
        }

        @font-face {
            font-family: 'NB International';
            src: url('NBInternationalItalicWebfont.woff2') format('woff2'),
                 url('NBInternationalItalicWebfont.woff') format('woff');
            font-weight: normal;
            font-style: italic;
            font-display: swap;
        }

        @font-face {
            font-family: 'NB International';
            src: url('NBInternationalBoldWebfont.woff2') format('woff2'),
                 url('NBInternationalBoldWebfont.woff') format('woff');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'NB International';
            src: url('NBInternationalLightWebfont.woff2') format('woff2'),
                 url('NBInternationalLightWebfont.woff') format('woff');
            font-weight: 300;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'NB International';
            src: url('NBInternationalBoldItalicWebfont.woff2') format('woff2'),
                 url('NBInternationalBoldItalicWebfont.woff') format('woff');
            font-weight: bold;
            font-style: italic;
            font-display: swap;
        }

        /* --- CSS Variables for the Opposite Wheel Math --- */
        :root {
            --img-h: 45vw;
            --img-gap: 20px;
        }

        /* --- Reset & Base Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Basis Grotesque Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #fff; 
            color: #000;
            overflow: hidden; 
            -webkit-font-smoothing: antialiased;
            font-weight: 500;
        }

        /* --- Seamless Teleportation Class --- */
        .no-transition, .no-transition * {
            transition: none !important;
        }

        /* --- Navigation --- */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 2rem 2vw 2rem 2vw;
            z-index: 100;
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 0px;
            color: #fff;
            mix-blend-mode: difference; 
            font-weight: 500;
        }

        intro {
            padding: 2rem 5vw;
            width: 100%;
            position: absolute;
            top: 60px;
        }

        nav .nav-links {
            display: flex;
            gap: 2rem;
        }

        nav a {
            color: inherit;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        nav a:hover {
            opacity: 0.6;
        }

        /* --- Split Layout Container --- */
        .split-layout {
            display: flex;
            width: 100%;
            height: 100vh;
            position: relative;
        }

        /* =========================================
           LEFT COLUMN: TEXT (Moves UP, Masked)
           ========================================= */
        .left-col {
            width: 55%;
            height: 100%;
            position: relative;
        }

        .text-mask {
            position: absolute;
            top: 35vh; 
            left: 2vw;
            right: 0;
            bottom: 0; 
            overflow: hidden; 
            padding-top: 2px; 
            margin-top: -2px;
        }

        .text-track {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .project-item {
            margin-bottom: 2vh; 
            cursor: pointer;
        }

        .project-link {
            display: flex;
            align-items: baseline; 
            text-decoration: none;
            color: inherit;
            outline: none;
        }

        .project-title {
            font-size: 4vw;
            font-weight: 500;
            letter-spacing: -2px;
            line-height: 1;
            color: rgba(0, 0, 0, 0.9); 
            transition: color 0.5s ease;
            white-space: nowrap;
        }

        .project-item.active .project-title {
            color: rgba(0, 0, 0, 0.9);
        }

        .project-details {
            margin-left: 1.25rem; 
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
            color: rgba(0, 0, 0, 0.6);
            opacity: 0;
            transform: translateX(-15px) translateY(-13px);
            transition: opacity 0.4s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .project-item.active .project-details {
            opacity: 1;
            transform: translateX(0) translateY(-13px);
            transition-delay: 0.2s; 
        }

        .text-overlay-panel {
            background-color: #ffffffe2;
            position: absolute;
            top: 4.8vw;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10;
            pointer-events: none;
        }

        /* =========================================
           RIGHT COLUMN: IMAGES (Moves DOWN, Unmasked)
           ========================================= */
        .right-col {
            width: 45%;
            height: 100%;
            position: relative;
        }

        .image-track {
            position: absolute;
            top: calc(50vh - (var(--img-h) / 2)); 
            left: 0;
            right: 5vw;
            transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .image-wrapper {
            position: absolute;
            left: 0;
            width: 79%;
            height: var(--img-h); 
            transform-origin: center;
            transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
            opacity: 0.15; 
            transform: scale(1);
            filter: blur(5px);
            background-color: rgba(0,0,0,0.03); 
        }

        .image-wrapper a {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
            cursor: pointer;
        }

        .image-wrapper img,
        .image-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            color: transparent; 
        }

        .image-wrapper.active {
            opacity: 1;
            transform: scale(1);
            filter: blur(0);
        }

        /* =========================================
           MOBILE SPECIFIC STYLES
           ========================================= */
        .mobile-list {
            display: none;
        }

        @media (max-width: 768px) {
            body {
                overflow-y: auto; 
                overflow-x: hidden;
            }

            nav {
                font-size: 1rem;
                flex-direction: column;
                gap: 1rem;
                padding: 1.5rem 5vw;
            }

            nav .nav-links {
                flex-wrap: wrap;
                gap: 1rem;
            }

            .split-layout {
                display: none;
            }

            .mobile-list {
                display: flex;
                flex-direction: column;
                gap: 4rem; 
                padding: 140px 5vw 5vw 5vw; 
                width: 100%;
            }

            .mobile-item {
                display: flex;
                flex-direction: column;
                text-decoration: none;
                color: inherit;
            }

            .mobile-image-wrapper {
                width: 100%;
                aspect-ratio: 4 / 5; 
                background-color: #eee;
                margin-bottom: 1rem;
                overflow: hidden;
            }

            .mobile-image-wrapper img,
            .mobile-image-wrapper video {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .mobile-title {
                font-size: 8vw;
                font-weight: 500;
                letter-spacing: -1px;
                line-height: 1.1;
                margin-bottom: 0.25rem;
            }

            .mobile-details {
                font-size: 0.8rem;
                text-transform: uppercase;
                letter-spacing: 1px;
                color: rgba(0, 0, 0, 0.6);
            }
        }

    </style>
</head>
<body>

    <nav>
        <div class="logo">
            <a href="index.html">Estefi Panizza</a>
        </div>
        <div class="nav-links">
            <div><a href="/">Work</a></div>
            <div><a href="/overview.html">Index</a></div>
            <div><a href="/about.html">About</a></div>
            <div><a href="mailto:hello@estefipanizza.com">Contact</a></div>
            <div><a href="https://instagram.com/estefi_panizza/">Instagram</a></div>
        </div>
    </nav>

    <div class="split-layout">
        <div class="left-col">
            <div class="text-mask">
                <div class="text-overlay-panel"></div>
                <div class="text-track" id="text-track"></div>
            </div>
        </div>
        <div class="right-col">
            <div class="image-track" id="image-track"></div>
        </div>
    </div>

    <div class="mobile-list" id="mobile-list"></div>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        const RANDOMIZE_PROJECTS = false; 
        
        const textTrack = document.getElementById('text-track');
        const imageTrack = document.getElementById('image-track');
        const mobileList = document.getElementById('mobile-list');
        
        let originalProjects = [];
        let N = 0;
        let infiniteProjects = [];
        let activeIndex = 0; 
        let snapTimeout;

        // 1. Fetch Projects from JSON
        async function fetchAndLoadProjects() {
            try {
                const response = await fetch('./projects.json');
                const projectsData = await response.json();

                originalProjects = Object.keys(projectsData).map(key => {
                    const project = projectsData[key];
                    const firstMedia = project.media && project.media.length > 0 ? project.media[0] : null;
                    const mediaType = firstMedia ? (firstMedia.type || 'image') : 'image';
                    const mediaSrc = firstMedia ? firstMedia.src : '';

                    return {
                        id: key, 
                        title: project.title,
                        details: project.location, 
                        date: project.year,       
                        category: project.category,       
                        client: project.client,       
                        mediaType: mediaType,
                        mediaSrc: mediaSrc
                    };
                });

                if (RANDOMIZE_PROJECTS) {
                    for (let i = originalProjects.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [originalProjects[i], originalProjects[j]] = [originalProjects[j], originalProjects[i]];
                    }
                }

                N = originalProjects.length;
                infiniteProjects = [...originalProjects, ...originalProjects, ...originalProjects];
                activeIndex = N;

                initDesktop();
                initMobile();

            } catch (error) {
                console.error("Error loading projects.json:", error);
                textTrack.innerHTML = `<div class="project-title" style="padding: 2vw;">Failed to load projects.</div>`;
                mobileList.innerHTML = `<div class="mobile-title" style="padding: 5vw;">Failed to load projects.</div>`;
            }
        }

        // ==========================================
        // CUSTOM LAZY LOADER FOR DESKTOP WHEEL
        // ==========================================
        function manageLazyLoading(currentIndex) {
            const imageItems = document.querySelectorAll('.image-wrapper');
            const indicesToLoad = [
                currentIndex - 2, currentIndex - 1, currentIndex, currentIndex + 1, currentIndex + 2
            ];

            indicesToLoad.forEach(idx => {
                if (idx >= 0 && idx < imageItems.length) {
                    const media = imageItems[idx].querySelector('img, video');
                    if (media && media.dataset.src) {
                        media.src = media.dataset.src;
                        media.removeAttribute('data-src');
                        
                        // Tell the browser to start fetching the video metadata right away
                        if (media.tagName === 'VIDEO') {
                            media.load();
                        }
                    }
                }
            });
        }

        // 2a. Build Desktop DOM
        function initDesktop() {
            infiniteProjects.forEach((project, index) => {
                const projectUrl = `project.html?id=${project.id}`;

                const textItem = document.createElement('div');
                textItem.classList.add('project-item');
                textItem.innerHTML = `
                    <a href="${projectUrl}" class="project-link" onclick="handleProjectClick(event, ${index})">
                        <div class="project-title">${project.title}</div>
                        <div class="project-details">${project.client}<br/>${project.category} - ${project.date}</div>
                    </a>
                `;
                textTrack.appendChild(textItem);

                const imgItem = document.createElement('div');
                imgItem.classList.add('image-wrapper');
                imgItem.style.top = `calc(-1 * ${index} * (var(--img-h) + var(--img-gap)))`;

                // AUTOPLAY REMOVED: Videos are now strictly controlled by JS
                const mediaHTML = project.mediaType === 'video' 
                    ? `<video data-src="${project.mediaSrc}" muted loop playsinline preload="none"></video>`
                    : `<img data-src="${project.mediaSrc}" alt="${project.title}">`;

                imgItem.innerHTML = `
                    <a href="${projectUrl}" onclick="handleProjectClick(event, ${index})">
                        ${mediaHTML}
                    </a>
                `;
                imageTrack.appendChild(imgItem);
            });

            // IMPORTANT: Start downloading the hero image/video IMMEDIATELY, don't wait for the 100ms timeout
            manageLazyLoading(activeIndex);

            setTimeout(() => {
                updateActiveProject(N);
            }, 100);
        }

        // 2b. Build Mobile DOM
        function initMobile() {
            // Set up an Intersection Observer to watch mobile videos
            const mobileVideoObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target;
                    
                    if (entry.isIntersecting) {
                        // If it enters the screen, load the src if it hasn't been loaded
                        if (video.dataset.src) {
                            video.src = video.dataset.src;
                            video.removeAttribute('data-src');
                            video.load();
                        }
                        // Play the video and catch any browser autoplay blocks
                        video.play().catch(e => console.log("Video wait", e));
                    } else {
                        // If it leaves the screen, pause it immediately to save CPU/Memory
                        if (!video.paused) {
                            video.pause();
                        }
                    }
                });
            }, { rootMargin: "100px", threshold: 0.3 }); // Triggers when 30% of the video is visible

            originalProjects.forEach(project => {
                const projectUrl = `project.html?id=${project.id}`;
                const mobileItem = document.createElement('a');
                mobileItem.href = projectUrl;
                mobileItem.className = 'mobile-item';

                // We use data-src for mobile videos too so they don't block the initial page load
                const mediaHTML = project.mediaType === 'video' 
                    ? `<video data-src="${project.mediaSrc}" muted loop playsinline preload="none"></video>`
                    : `<img src="${project.mediaSrc}" alt="${project.title}" loading="lazy">`;

                mobileItem.innerHTML = `
                    <div class="mobile-image-wrapper">
                        ${mediaHTML}
                    </div>
                    <div class="mobile-title">${project.title}</div>
                    <div class="mobile-details">${project.client} / ${project.category} - ${project.date}</div>
                `;

                mobileList.appendChild(mobileItem);
            });

            // Tell the observer to watch all newly created mobile videos
            document.querySelectorAll('.mobile-image-wrapper video').forEach(video => {
                mobileVideoObserver.observe(video);
            });
        }

        window.handleProjectClick = function(event, index) {
            if (window.innerWidth > 768 && index !== activeIndex) {
                event.preventDefault(); 
                updateActiveProject(index); 
            }
        };

        function updateActiveProject(newIndex) {
            if (window.innerWidth <= 768) return; 

            activeIndex = newIndex;
            
            manageLazyLoading(activeIndex);

            const textItems = document.querySelectorAll('.project-item');
            const imageItems = document.querySelectorAll('.image-wrapper');

            const textOffset = textItems[activeIndex].offsetTop;
            textTrack.style.transform = `translateY(-${textOffset}px)`;
            
            imageTrack.style.transform = `translateY(calc(${activeIndex} * (var(--img-h) + var(--img-gap))))`;

            // === DESKTOP VIDEO PLAY/PAUSE LOGIC ===
            imageItems.forEach((item, idx) => {
                const isActive = idx === activeIndex;
                item.classList.toggle('active', isActive);
                
                const video = item.querySelector('video');
                if (video) {
                    if (isActive) {
                        // Tiny timeout ensures the source is fully assigned before pressing play
                        setTimeout(() => {
                            video.play().catch(e => console.log("Video wait", e));
                        }, 50);
                    } else {
                        // Force pause on any video that is not the currently active slide
                        if (!video.paused) video.pause();
                    }
                }
            });

            clearTimeout(snapTimeout);
            
            snapTimeout = setTimeout(() => {
                let needsSnap = false;
                let mappedIndex = activeIndex;

                if (activeIndex < N) {
                    mappedIndex = activeIndex + N;
                    needsSnap = true;
                } 
                else if (activeIndex >= 2 * N) {
                    mappedIndex = activeIndex - N;
                    needsSnap = true;
                }

                if (needsSnap) {
                    document.body.classList.add('no-transition');
                    
                    activeIndex = mappedIndex;

                    manageLazyLoading(activeIndex);
                    
                    const snapTextOffset = textItems[activeIndex].offsetTop;
                    textTrack.style.transform = `translateY(-${snapTextOffset}px)`;
                    imageTrack.style.transform = `translateY(calc(${activeIndex} * (var(--img-h) + var(--img-gap))))`;

                    imageItems.forEach((item, idx) => {
                        const isActive = idx === activeIndex;
                        item.classList.toggle('active', isActive);
                        const video = item.querySelector('video');
                        if(video) {
                            if (isActive) {
                                setTimeout(() => video.play().catch(e => {}), 50);
                            } else {
                                if(!video.paused) video.pause();
                            }
                        }
                    });

                    void document.body.offsetWidth; 
                    
                    document.body.classList.remove('no-transition');
                }
            }, 1000); 
        }

        /* =========================================
           SCROLL & SWIPE LISTENER LOGIC
           ========================================= */
        let isThrottled = false;
        let scrollAccumulator = 0;
        
        window.addEventListener('wheel', (e) => {
            if (window.innerWidth <= 768) return; 
            if (isThrottled) return;

            scrollAccumulator += e.deltaY;

            if (Math.abs(scrollAccumulator) > 50) {
                if (scrollAccumulator > 0) {
                    updateActiveProject(activeIndex + 1); 
                } else {
                    updateActiveProject(activeIndex - 1); 
                }
                
                scrollAccumulator = 0;
                isThrottled = true;
                
                setTimeout(() => {
                    isThrottled = false;
                }, 800); 
            }
        });

        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            if (window.innerWidth <= 768) return;
            touchStartY = e.touches[0].clientY;
        });

        window.addEventListener('touchmove', (e) => {
            if (window.innerWidth <= 768) return;
            if (isThrottled) return;
            
            const touchEndY = e.touches[0].clientY;
            const delta = touchStartY - touchEndY; 
            
            if (Math.abs(delta) > 50) {
                if (delta > 0) {
                    updateActiveProject(activeIndex + 1);
                } else {
                    updateActiveProject(activeIndex - 1);
                }
                
                touchStartY = touchEndY; 
                isThrottled = true;
                
                setTimeout(() => {
                    isThrottled = false;
                }, 800);
            }
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                document.body.style.overflow = 'hidden'; 
                updateActiveProject(activeIndex);
            } else {
                document.body.style.overflow = 'auto'; 
            }
        });

        // Kick off the data fetch on page load
        fetchAndLoadProjects();
    </script>
</body>
</html>
