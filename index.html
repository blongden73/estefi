<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estefi Panizza Art Direction</title>
    <style>
        @font-face {

    }

    @font-face {
        font-family: 'Basis Grotesque Pro';
        src: url('assets/BasisGrotesquePro-MediumItalic.woff2') format('woff2'),
            url('assets/BasisGrotesquePro-MediumItalic.woff') format('woff');
        font-weight: 500;
        font-style: italic;
        font-display: swap;
    }

    @font-face {
        font-family: 'Basis Grotesque Pro';
        src: url('Bassets/asisGrotesquePro-Medium.woff2') format('woff2'),
            url('assets/BasisGrotesquePro-Medium.woff') format('woff');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
    }
        @font-face {
            font-family: 'NB International';
            src: url('NBInternationalMonoWebfont.woff2') format('woff2'),
                 url('NBInternationalMonoWebfont.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'NB International';
            src: url('NBInternationalRegularWebfont.woff2') format('woff2'),
                 url('NBInternationalRegularWebfont.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'NB International';
            src: url('NBInternationalLightItalicWebfont.woff2') format('woff2'),
                 url('NBInternationalLightItalicWebfont.woff') format('woff');
            font-weight: 300;
            font-style: italic;
            font-display: swap;
        }

        @font-face {
            font-family: 'NB International';
            src: url('NBInternationalItalicWebfont.woff2') format('woff2'),
                 url('NBInternationalItalicWebfont.woff') format('woff');
            font-weight: normal;
            font-style: italic;
            font-display: swap;
        }

        @font-face {
            font-family: 'NB International';
            src: url('NBInternationalBoldWebfont.woff2') format('woff2'),
                 url('NBInternationalBoldWebfont.woff') format('woff');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'NB International';
            src: url('NBInternationalLightWebfont.woff2') format('woff2'),
                 url('NBInternationalLightWebfont.woff') format('woff');
            font-weight: 300;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'NB International';
            src: url('NBInternationalBoldItalicWebfont.woff2') format('woff2'),
                 url('NBInternationalBoldItalicWebfont.woff') format('woff');
            font-weight: bold;
            font-style: italic;
            font-display: swap;
        }

        /* --- CSS Variables for the Opposite Wheel Math --- */
        :root {
            --img-h: 45vw;
            --img-gap: 20px;
        }

        /* --- Reset & Base Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Basis Grotesque Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #faf9f2; 
            color: #111;
            overflow: hidden; 
            -webkit-font-smoothing: antialiased;
            font-weight: 500;
        }

        /* --- Seamless Teleportation Class --- */
        .no-transition, .no-transition * {
            transition: none !important;
        }

        /* --- Navigation --- */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 2rem 2vw 2rem 2vw;
            z-index: 100;
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 0px;
            color: #fff;
            mix-blend-mode: difference; 
            font-weight: 500;
        }

        intro {
            padding: 2rem 5vw;
            width: 100%;
            position: absolute;
            top: 60px;
        }

        nav .nav-links {
            display: flex;
            gap: 2rem;
        }

        nav a {
            color: inherit;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        nav a:hover {
            opacity: 0.6;
        }

        /* --- Split Layout Container --- */
        .split-layout {
            display: flex;
            width: 100%;
            height: 100vh;
            position: relative;
        }

        /* =========================================
           LEFT COLUMN: TEXT (Moves UP, Masked)
           ========================================= */
        .left-col {
            width: 55%;
            height: 100%;
            position: relative;
        }

        .text-mask {
            position: absolute;
            top: 35vh; 
            left: 2vw;
            right: 0;
            bottom: 0; 
            overflow: hidden; 
            padding-top: 2px; 
            margin-top: -2px;
        }

        .text-track {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .project-item {
            margin-bottom: 2vh; 
            cursor: pointer;
        }

        .project-link {
            display: flex;
            align-items: baseline; 
            text-decoration: none;
            color: inherit;
            outline: none;
        }

        .project-title {
            font-size: 4vw;
            font-weight: 500;
            letter-spacing: -2px;
            line-height: 1;
            color: rgba(0, 0, 0, 0.9); 
            transition: color 0.5s ease;
            white-space: nowrap;
        }

        .project-item.active .project-title {
            color: rgba(0, 0, 0, 0.9);
        }

        .project-details {
            margin-left: 1.25rem; 
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
            color: rgba(0, 0, 0, 0.6);
            opacity: 0;
            transform: translateX(-15px) translateY(-13px);
            transition: opacity 0.4s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .project-item.active .project-details {
            opacity: 1;
            transform: translateX(0) translateY(-13px);
            transition-delay: 0.2s; 
        }

        .text-overlay-panel {
            background-color: #faf9f2d4;
            position: absolute;
            top: 4vw;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10;
            pointer-events: none;
        }

        /* =========================================
           RIGHT COLUMN: IMAGES (Moves DOWN, Unmasked)
           ========================================= */
        .right-col {
            width: 45%;
            height: 100%;
            position: relative;
        }

        .image-track {
            position: absolute;
            top: calc(50vh - (var(--img-h) / 2)); 
            left: 0;
            right: 5vw;
            transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .image-wrapper {
            position: absolute;
            left: 0;
            width: 79%;
            height: var(--img-h); 
            transform-origin: center;
            transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
            opacity: 0.15; 
            transform: scale(1);
            filter: blur(5px);
        }

        .image-wrapper a {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
            cursor: pointer;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-wrapper.active {
            opacity: 1;
            transform: scale(1);
            filter: blur(0);
        }

    </style>
</head>
<body>

    <nav>
        <div class="logo">
            <a href="index.html">Estefi Panizza</a>
        </div>
        <div class="nav-links">
            <div><a href="/">Work</a></div>
            <div><a href="about.html">About</a></div>
            <div><a href="mailto:hello@estefipanizza.com">Contact</a></div>
            <div><a href="https://instagram.com/estefi_panizza/">Instagram</a></div>
        </div>
    </nav>

    <div class="split-layout">
        <div class="left-col">
            <div class="text-mask">
                <div class="text-overlay-panel"></div>
                <div class="text-track" id="text-track"></div>
            </div>
        </div>
        <div class="right-col">
            <div class="image-track" id="image-track"></div>
        </div>
    </div>

    <script>
        const textTrack = document.getElementById('text-track');
        const imageTrack = document.getElementById('image-track');
        
        let originalProjects = [];
        let N = 0;
        let infiniteProjects = [];
        let activeIndex = 0; 
        let snapTimeout;

        // 1. Fetch Projects from JSON
        async function fetchAndLoadProjects() {
            try {
                const response = await fetch('./projects.json');
                const projectsData = await response.json();

                // Convert JSON object into an array we can map over
                originalProjects = Object.keys(projectsData).map(key => {
                    const project = projectsData[key];
                    return {
                        id: key, // This acts as the slug for the URL
                        title: project.title,
                        details: project.location, // Assuming 'location' based on project.html code
                        date: project.year,       // Assuming 'year' based on project.html code
                        // Grab the first piece of media to use as the index thumbnail
                        imgSrc: project.media && project.media.length > 0 ? project.media[0].src : '' 
                    };
                });

                // ==========================================
                // NEW: Randomize the order of the projects
                // ==========================================
                for (let i = originalProjects.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [originalProjects[i], originalProjects[j]] = [originalProjects[j], originalProjects[i]];
                }

                N = originalProjects.length;
                infiniteProjects = [...originalProjects, ...originalProjects, ...originalProjects];
                activeIndex = N;

                // Build the DOM
                init();

            } catch (error) {
                console.error("Error loading projects.json:", error);
                textTrack.innerHTML = `<div class="project-title" style="padding: 2vw;">Failed to load projects.</div>`;
            }
        }

        // 2. Build the initial DOM based on the fetched array
        function init() {
            infiniteProjects.forEach((project, index) => {
                // Generates link dynamically based on the JSON object key
                const projectUrl = `project.html?id=${project.id}`;

                // Text Setup
                const textItem = document.createElement('div');
                textItem.classList.add('project-item');
                textItem.innerHTML = `
                    <a href="${projectUrl}" class="project-link" onclick="handleProjectClick(event, ${index})">
                        <div class="project-title">${project.title}</div>
                        <div class="project-details">${project.details}<br/>${project.date}</div>
                    </a>
                `;
                textTrack.appendChild(textItem);

                // Image Setup
                const imgItem = document.createElement('div');
                imgItem.classList.add('image-wrapper');
                imgItem.style.top = `calc(-1 * ${index} * (var(--img-h) + var(--img-gap)))`;
                imgItem.innerHTML = `
                    <a href="${projectUrl}" onclick="handleProjectClick(event, ${index})">
                        <img src="${project.imgSrc}" alt="${project.title}">
                    </a>
                `;
                imageTrack.appendChild(imgItem);
            });

            setTimeout(() => updateActiveProject(N), 100);
        }

        // Handles clicks on both images and text
        window.handleProjectClick = function(event, index) {
            // If the user clicks an item that is NOT the active one, scroll to it instead of linking
            if (index !== activeIndex) {
                event.preventDefault(); 
                updateActiveProject(index); 
            }
            // If it IS active, we do nothing to the event, allowing the browser to navigate to project.html
        };

        function updateActiveProject(newIndex) {
            activeIndex = newIndex;
            const textItems = document.querySelectorAll('.project-item');
            const imageItems = document.querySelectorAll('.image-wrapper');

            const textOffset = textItems[activeIndex].offsetTop;
            textTrack.style.transform = `translateY(-${textOffset}px)`;
            
            imageTrack.style.transform = `translateY(calc(${activeIndex} * (var(--img-h) + var(--img-gap))))`;

            textItems.forEach((item, idx) => item.classList.toggle('active', idx === activeIndex));
            imageItems.forEach((item, idx) => item.classList.toggle('active', idx === activeIndex));

            clearTimeout(snapTimeout);
            
            snapTimeout = setTimeout(() => {
                let needsSnap = false;
                let mappedIndex = activeIndex;

                if (activeIndex < N) {
                    mappedIndex = activeIndex + N;
                    needsSnap = true;
                } 
                else if (activeIndex >= 2 * N) {
                    mappedIndex = activeIndex - N;
                    needsSnap = true;
                }

                if (needsSnap) {
                    document.body.classList.add('no-transition');
                    
                    activeIndex = mappedIndex;
                    
                    const snapTextOffset = textItems[activeIndex].offsetTop;
                    textTrack.style.transform = `translateY(-${snapTextOffset}px)`;
                    imageTrack.style.transform = `translateY(calc(${activeIndex} * (var(--img-h) + var(--img-gap))))`;

                    textItems.forEach((item, idx) => item.classList.toggle('active', idx === activeIndex));
                    imageItems.forEach((item, idx) => item.classList.toggle('active', idx === activeIndex));

                    void document.body.offsetWidth; 
                    
                    document.body.classList.remove('no-transition');
                }
            }, 1000); 
        }

        /* =========================================
           SCROLL & SWIPE LISTENER LOGIC
           ========================================= */
        let isThrottled = false;
        let scrollAccumulator = 0;
        
        window.addEventListener('wheel', (e) => {
            if (isThrottled) return;

            scrollAccumulator += e.deltaY;

            if (Math.abs(scrollAccumulator) > 50) {
                if (scrollAccumulator > 0) {
                    updateActiveProject(activeIndex + 1); 
                } else {
                    updateActiveProject(activeIndex - 1); 
                }
                
                scrollAccumulator = 0;
                isThrottled = true;
                
                setTimeout(() => {
                    isThrottled = false;
                }, 800); 
            }
        });

        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        });

        window.addEventListener('touchmove', (e) => {
            if (isThrottled) return;
            
            const touchEndY = e.touches[0].clientY;
            const delta = touchStartY - touchEndY; 
            
            if (Math.abs(delta) > 50) {
                if (delta > 0) {
                    updateActiveProject(activeIndex + 1);
                } else {
                    updateActiveProject(activeIndex - 1);
                }
                
                touchStartY = touchEndY; 
                isThrottled = true;
                
                setTimeout(() => {
                    isThrottled = false;
                }, 800);
            }
        });

        window.addEventListener('resize', () => updateActiveProject(activeIndex));

        // Kick off the data fetch on page load
        fetchAndLoadProjects();
    </script>
</body>
</html>
