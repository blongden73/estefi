<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estefi Panizza Art Direction</title>
    <style>
        @font-face {
        font-family: 'Basis Grotesque Pro';
        src: url('assets/BasisGrotesquePro-Regular.woff2') format('woff2'),
            url('assets/BasisGrotesquePro-Regular.woff') format('woff');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
    }

    @font-face {
        font-family: 'Basis Grotesque Pro';
        src: url('assets/BasisGrotesquePro-Italic.woff2') format('woff2'),
            url('assets/BasisGrotesquePro-Italic.woff') format('woff');
        font-weight: normal;
        font-style: italic;
        font-display: swap;
    }

    @font-face {
        font-family: 'Basis Grotesque Pro';
        src: url('assets/BasisGrotesquePro-MediumItalic.woff2') format('woff2'),
            url('assets/BasisGrotesquePro-MediumItalic.woff') format('woff');
        font-weight: 500;
        font-style: italic;
        font-display: swap;
    }

    @font-face {
        font-family: 'Basis Grotesque Pro';
        src: url('Bassets/asisGrotesquePro-Medium.woff2') format('woff2'),
            url('assets/BasisGrotesquePro-Medium.woff') format('woff');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
    }
        @font-face {
            font-family: 'NB International';
            src: url('NBInternationalMonoWebfont.woff2') format('woff2'),
                 url('NBInternationalMonoWebfont.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'NB International';
            src: url('NBInternationalRegularWebfont.woff2') format('woff2'),
                 url('NBInternationalRegularWebfont.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'NB International';
            src: url('NBInternationalLightItalicWebfont.woff2') format('woff2'),
                 url('NBInternationalLightItalicWebfont.woff') format('woff');
            font-weight: 300;
            font-style: italic;
            font-display: swap;
        }

        @font-face {
            font-family: 'NB International';
            src: url('NBInternationalItalicWebfont.woff2') format('woff2'),
                 url('NBInternationalItalicWebfont.woff') format('woff');
            font-weight: normal;
            font-style: italic;
            font-display: swap;
        }

        @font-face {
            font-family: 'NB International';
            src: url('NBInternationalBoldWebfont.woff2') format('woff2'),
                 url('NBInternationalBoldWebfont.woff') format('woff');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'NB International';
            src: url('NBInternationalLightWebfont.woff2') format('woff2'),
                 url('NBInternationalLightWebfont.woff') format('woff');
            font-weight: 300;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'NB International';
            src: url('NBInternationalBoldItalicWebfont.woff2') format('woff2'),
                 url('NBInternationalBoldItalicWebfont.woff') format('woff');
            font-weight: bold;
            font-style: italic;
            font-display: swap;
        }

        /* --- CSS Variables for the Opposite Wheel Math --- */
        :root {
            --img-h: 45vw;
            --img-gap: 20px;
        }

        /* --- Reset & Base Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Basis Grotesque Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #fff; 
            color: #000;
            overflow: hidden; 
            -webkit-font-smoothing: antialiased;
            font-weight: 500;
        }

        /* --- Seamless Teleportation Class --- */
        .no-transition, .no-transition * {
            transition: none !important;
        }

        /* --- Navigation --- */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 2rem 2vw 2rem 2vw;
            z-index: 100;
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 0px;
            color: #fff;
            mix-blend-mode: difference; 
            font-weight: 500;
        }

        /* Mobile Hamburger Button (Hidden on Desktop) */
        .mobile-menu-toggle {
            display: none;
            background: none;
            border: none;
            width: 32px;
            height: 20px;
            position: relative;
            cursor: pointer;
            z-index: 200;
            color: inherit;
        }

        .hamburger-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background-color: currentColor;
            left: 0;
            transition: transform 0.3s ease, top 0.3s ease;
        }

        .hamburger-line:first-child { top: 4px; }
        .hamburger-line:last-child { top: 14px; }

        /* Hamburger Morph Animation */
        nav.menu-open .hamburger-line:first-child {
            top: 9px;
            transform: rotate(45deg);
        }
        nav.menu-open .hamburger-line:last-child {
            top: 9px;
            transform: rotate(-45deg);
        }

        intro {
            padding: 2rem 5vw;
            width: 100%;
            position: absolute;
            top: 60px;
        }

        nav .nav-links {
            display: flex;
            gap: 2rem;
        }

        nav a {
            color: inherit;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        nav a:hover {
            opacity: 0.6;
        }

        /* --- Split Layout Container --- */
        .split-layout {
            display: flex;
            width: 100%;
            height: 100vh;
            position: relative;
        }

        /* =========================================
           LEFT COLUMN: TEXT (Moves UP, Masked)
           ========================================= */
        .left-col {
            width: 55%;
            height: 100%;
            position: relative;
        }

        .text-mask {
            position: absolute;
            top: 35vh; 
            left: 2vw;
            right: 0;
            bottom: 0; 
            overflow: hidden; 
            padding-top: 2px; 
            margin-top: -2px;
        }

        .text-track {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            will-change: transform; 
        }

        .project-item {
            margin-bottom: 2vh; 
            cursor: pointer;
        }

        .project-link {
            display: flex;
            align-items: baseline; 
            text-decoration: none;
            color: inherit;
            outline: none;
        }

        .project-title {
            font-size: 4vw;
            font-weight: 500;
            letter-spacing: -2px;
            line-height: 1;
            color: rgba(0, 0, 0, 0.9); 
            transition: color 0.5s ease;
            white-space: nowrap;
        }

        .project-item.active .project-title {
            color: rgba(0, 0, 0, 0.9);
        }

        .project-details {
            margin-left: 1.25rem; 
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
            color: rgba(0, 0, 0, 0.6);
            opacity: 0;
            transform: translateX(-15px) translateY(-13px);
            transition: opacity 0.4s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .project-item.active .project-details {
            opacity: 1;
            transform: translateX(0) translateY(-13px);
            transition-delay: 0.2s; 
        }

        .text-overlay-panel {
            background-color: #ffffffe2;
            position: absolute;
            top: 4.8vw;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10;
            pointer-events: none;
        }

        /* =========================================
           RIGHT COLUMN: IMAGES (Moves DOWN, Unmasked)
           ========================================= */
        .right-col {
            width: 45%;
            height: 100%;
            position: relative;
        }

        .image-track {
            position: absolute;
            top: calc(50vh - (var(--img-h) / 2)); 
            left: 0;
            right: 5vw;
            will-change: transform; 
        }

        .image-wrapper {
            position: absolute;
            left: 0;
            width: 79%;
            height: var(--img-h); 
            transform-origin: center;
            transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
            opacity: 0.15; 
            transform: scale(1);
            filter: blur(5px);
            background-color: rgba(0,0,0,0.03); 
        }

        .image-wrapper a {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
            cursor: pointer;
        }

        .image-wrapper img,
        .image-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            color: transparent; 
        }

        .image-wrapper.active {
            opacity: 1;
            transform: scale(1);
            filter: blur(0);
        }

        /* =========================================
           MOBILE SPECIFIC STYLES
           ========================================= */
        .mobile-list {
            display: none;
        }

        @media (max-width: 768px) {
            body {
                overflow-y: auto; 
                overflow-x: hidden;
            }

            nav {
                font-size: 1rem;
                flex-direction: row; 
                align-items: center;
                padding: 1.5rem 5vw;
                transition: mix-blend-mode 0.3s ease;
            }

            .mobile-menu-toggle {
                display: block; 
            }

            .logo, .mobile-menu-toggle {
                position: relative;
                z-index: 200; 
            }

            nav .nav-links {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background-color: #fff; /* FIXED: Now perfectly pure white */
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 2.5rem;
                font-size: 2.5rem;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.4s ease;
                z-index: 100;
            }

            nav.menu-open {
                mix-blend-mode: normal; 
                color: #000; 
            }

            nav.menu-open .nav-links {
                opacity: 1;
                pointer-events: auto;
            }

            .split-layout {
                display: none;
            }

            .mobile-list {
                display: flex;
                flex-direction: column;
                gap: 4rem; 
                padding: 100px 5vw 5vw 5vw; 
                width: 100%;
            }

            .mobile-item {
                display: flex;
                flex-direction: column;
                text-decoration: none;
                color: inherit;
            }

            .mobile-image-wrapper {
                width: 100%;
                aspect-ratio: 9 / 15; 
                background-color: #eee;
                margin-bottom: 1rem;
                overflow: hidden;
            }

            .mobile-image-wrapper img,
            .mobile-image-wrapper video {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .mobile-title {
                font-size: 8vw;
                font-weight: 500;
                letter-spacing: -1px;
                line-height: 1.1;
                margin-bottom: 0.25rem;
            }

            .mobile-details {
                font-size: 0.8rem;
                text-transform: uppercase;
                letter-spacing: 1px;
                color: rgba(0, 0, 0, 0.6);
            }
        }

    </style>
</head>
<body>

    <nav id="main-nav">
        <div class="logo">
            <a href="index.html">Estefi Panizza</a>
        </div>
        
        <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle Menu">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
        </button>

        <div class="nav-links">
            <div><a href="/">Work</a></div>
            <div><a href="/overview.html">Index</a></div>
            <div><a href="/about.html">About</a></div>
            <div><a href="/about.html#email">Contact</a></div>
            <div><a href="https://instagram.com/estefi_panizza/">Instagram</a></div>
        </div>
    </nav>

    <div class="split-layout">
        <div class="left-col">
            <div class="text-mask">
                <div class="text-overlay-panel"></div>
                <div class="text-track" id="text-track"></div>
            </div>
        </div>
        <div class="right-col">
            <div class="image-track" id="image-track"></div>
        </div>
    </div>

    <div class="mobile-list" id="mobile-list"></div>

    <script>
        // ==========================================
        // MOBILE MENU LOGIC
        // ==========================================
        const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
        const mainNav = document.getElementById('main-nav');

        mobileMenuToggle.addEventListener('click', () => {
            mainNav.classList.toggle('menu-open');
            if (mainNav.classList.contains('menu-open')) {
                document.body.style.overflow = 'hidden'; 
            } else {
                document.body.style.overflow = 'auto'; 
            }
        });

        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                if (window.innerWidth <= 768) {
                    mainNav.classList.remove('menu-open');
                    document.body.style.overflow = 'auto';
                }
            });
        });

        // ==========================================
        // CONFIGURATION
        // ==========================================
        const RANDOMIZE_PROJECTS = false; 
        
        const textTrack = document.getElementById('text-track');
        const imageTrack = document.getElementById('image-track');
        const mobileList = document.getElementById('mobile-list');
        
        let originalProjects = [];
        let N = 0;
        let infiniteProjects = [];

        let targetIndex = 0;
        let currentIndex = 0;
        let activeIndex = -1; 

        // 1. Fetch Projects from JSON
        async function fetchAndLoadProjects() {
            try {
                const response = await fetch('./projects.json');
                const projectsData = await response.json();

                originalProjects = Object.keys(projectsData).map(key => {
                    const project = projectsData[key];
                    const firstMedia = project.media && project.media.length > 0 ? project.media[0] : null;
                    const mediaType = firstMedia ? (firstMedia.type || 'image') : 'image';
                    const mediaSrc = firstMedia ? firstMedia.src : '';

                    return {
                        id: key, 
                        title: project.title,
                        details: project.location, 
                        date: project.year,       
                        category: project.category,       
                        client: project.client,       
                        mediaType: mediaType,
                        mediaSrc: mediaSrc
                    };
                });

                if (RANDOMIZE_PROJECTS) {
                    for (let i = originalProjects.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [originalProjects[i], originalProjects[j]] = [originalProjects[j], originalProjects[i]];
                    }
                }

                N = originalProjects.length;
                infiniteProjects = [...originalProjects, ...originalProjects, ...originalProjects];
                
                targetIndex = N;
                currentIndex = N;

                initDesktop();
                initMobile();

            } catch (error) {
                console.error("Error loading projects.json:", error);
                textTrack.innerHTML = `<div class="project-title" style="padding: 2vw;">Failed to load projects.</div>`;
                mobileList.innerHTML = `<div class="mobile-title" style="padding: 5vw;">Failed to load projects.</div>`;
            }
        }

        // ==========================================
        // CUSTOM LAZY LOADER FOR DESKTOP WHEEL
        // ==========================================
        function manageLazyLoading(currentIdx) {
            const imageItems = document.querySelectorAll('.image-wrapper');
            const indicesToLoad = [
                currentIdx - 2, currentIdx - 1, currentIdx, currentIdx + 1, currentIdx + 2
            ];

            indicesToLoad.forEach(idx => {
                if (idx >= 0 && idx < imageItems.length) {
                    const media = imageItems[idx].querySelector('img, video');
                    if (media && media.dataset.src) {
                        media.src = media.dataset.src;
                        media.removeAttribute('data-src');
                        
                        if (media.tagName === 'VIDEO') {
                            media.load();
                        }
                    }
                }
            });
        }

        // 2a. Build Desktop DOM
        function initDesktop() {
            infiniteProjects.forEach((project, index) => {
                const projectUrl = `project.html?id=${project.id}`;

                const textItem = document.createElement('div');
                textItem.classList.add('project-item');
                textItem.innerHTML = `
                    <a href="${projectUrl}" class="project-link" onclick="handleProjectClick(event, ${index})">
                        <div class="project-title">${project.title}</div>
                        <div class="project-details">${project.client}<br/>${project.category} - ${project.date}</div>
                    </a>
                `;
                textTrack.appendChild(textItem);

                const imgItem = document.createElement('div');
                imgItem.classList.add('image-wrapper');
                imgItem.style.top = `calc(-1 * ${index} * (var(--img-h) + var(--img-gap)))`;

                const mediaHTML = project.mediaType === 'video' 
                    ? `<video data-src="${project.mediaSrc}" muted loop playsinline preload="none"></video>`
                    : `<img data-src="${project.mediaSrc}" alt="${project.title}">`;

                imgItem.innerHTML = `
                    <a href="${projectUrl}" onclick="handleProjectClick(event, ${index})">
                        ${mediaHTML}
                    </a>
                `;
                imageTrack.appendChild(imgItem);
            });

            renderLoop();
        }

        // 2b. Build Mobile DOM
        function initMobile() {
            const mobileVideoObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target;
                    
                    if (entry.isIntersecting) {
                        if (video.dataset.src) {
                            video.src = video.dataset.src;
                            video.removeAttribute('data-src');
                            video.load();
                        }
                        video.play().catch(e => console.log("Video wait", e));
                    } else {
                        if (!video.paused) {
                            video.pause();
                        }
                    }
                });
            }, { rootMargin: "100px", threshold: 0.3 });

            originalProjects.forEach(project => {
                const projectUrl = `project.html?id=${project.id}`;
                const mobileItem = document.createElement('a');
                mobileItem.href = projectUrl;
                mobileItem.className = 'mobile-item';

                const mediaHTML = project.mediaType === 'video' 
                    ? `<video data-src="${project.mediaSrc}" muted loop playsinline preload="none"></video>`
                    : `<img src="${project.mediaSrc}" alt="${project.title}" loading="lazy">`;

                mobileItem.innerHTML = `
                    <div class="mobile-image-wrapper">
                        ${mediaHTML}
                    </div>
                    <div class="mobile-title">${project.title}</div>
                    <div class="mobile-details">${project.client} / ${project.category} - ${project.date}</div>
                `;

                mobileList.appendChild(mobileItem);
            });

            document.querySelectorAll('.mobile-image-wrapper video').forEach(video => {
                mobileVideoObserver.observe(video);
            });
        }

        // Handle Desktop Click
        window.handleProjectClick = function(event, index) {
            if (window.innerWidth > 768) {
                const roundedCurrent = Math.round(currentIndex);
                if (index !== roundedCurrent) {
                    event.preventDefault(); 
                    targetIndex = index; 
                }
            }
        };

        /* =========================================
           FREE-FORM SCROLL & SNAP ENGINE
           ========================================= */
        let snapTimeout;

        window.addEventListener('wheel', (e) => {
            if (window.innerWidth <= 768) return; 

            targetIndex += e.deltaY * 0.003;

            clearTimeout(snapTimeout);
            snapTimeout = setTimeout(() => {
                targetIndex = Math.round(targetIndex);
            }, 100); 
        });

        let lastTouchY = 0;
        window.addEventListener('touchstart', (e) => {
            if (window.innerWidth <= 768) return;
            lastTouchY = e.touches[0].clientY;
        });

        window.addEventListener('touchmove', (e) => {
            if (window.innerWidth <= 768) return;
            
            const touchY = e.touches[0].clientY;
            const deltaY = lastTouchY - touchY;
            
            targetIndex += deltaY * 0.005; 
            lastTouchY = touchY;

            clearTimeout(snapTimeout);
            snapTimeout = setTimeout(() => {
                targetIndex = Math.round(targetIndex);
            }, 100);
        });

        function getImageStep() {
            return (window.innerWidth * 0.45) + 20; 
        }

        /* =========================================
           CONTINUOUS RENDER LOOP
           ========================================= */
        function renderLoop() {
            if (window.innerWidth <= 768) {
                requestAnimationFrame(renderLoop);
                return;
            }

            if (targetIndex < N) {
                targetIndex += N;
                currentIndex += N;
            } else if (targetIndex >= 2 * N) {
                targetIndex -= N;
                currentIndex -= N;
            }

            currentIndex += (targetIndex - currentIndex) * 0.08;

            const currentRoundedIdx = Math.round(currentIndex);

            const textItems = document.querySelectorAll('.project-item');
            if (textItems.length > 0) {
                const floorIdx = Math.floor(currentIndex);
                const ceilIdx = Math.min(floorIdx + 1, textItems.length - 1);
                const remainder = currentIndex - floorIdx;
                
                const offsetFloor = textItems[floorIdx] ? textItems[floorIdx].offsetTop : 0;
                const offsetCeil = textItems[ceilIdx] ? textItems[ceilIdx].offsetTop : 0;
                
                const textOffset = offsetFloor + ((offsetCeil - offsetFloor) * remainder);
                textTrack.style.transform = `translate3d(0, -${textOffset}px, 0)`;
            }

            const imageOffset = currentIndex * getImageStep();
            imageTrack.style.transform = `translate3d(0, ${imageOffset}px, 0)`;

            if (currentRoundedIdx !== activeIndex) {
                activeIndex = currentRoundedIdx;
                
                manageLazyLoading(activeIndex);

                const iItems = document.querySelectorAll('.image-wrapper');
                
                textItems.forEach((item, idx) => item.classList.toggle('active', idx === activeIndex));
                iItems.forEach((item, idx) => item.classList.toggle('active', idx === activeIndex));

                iItems.forEach((item, idx) => {
                    const video = item.querySelector('video');
                    if (video) {
                        if (idx === activeIndex) {
                            setTimeout(() => {
                                video.play().catch(e => console.log("Video Wait"));
                            }, 50);
                        } else {
                            if (!video.paused) video.pause();
                        }
                    }
                });
            }

            requestAnimationFrame(renderLoop);
        }

        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                document.body.style.overflow = 'hidden'; 
                targetIndex = Math.round(targetIndex);
                
                mainNav.classList.remove('menu-open'); 
            } else {
                document.body.style.overflow = 'auto'; 
            }
        });

        // Kick off the data fetch on page load
        fetchAndLoadProjects();
    </script>
</body>
</html>
